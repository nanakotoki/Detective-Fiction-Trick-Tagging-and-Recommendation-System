<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#11131a" />
    <title>推理小说诡计标签分析与推荐系统</title>
    <meta
      name="description"
      content="严格无剧透的推理小说诡计标签分析系统：标注核心诡计标签、推荐诡计机制高度相似的 3 部作品、汇总各平台去剧透评价。"
    />
    <meta name="author" content="Detective Fiction Trick Tagging & Recommendation System" />
    <meta name="robots" content="index,follow" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/print.css" media="print" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主内容</a>

    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/analyze" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="13.5" cy="13.5" r="8" />
              <path d="M19.6 19.6 27 27" />
              <path d="M10 13.5h7" />
              <path d="M13.5 10v7" />
            </svg>
          </span>
          <span class="brand-text">
            <strong>诡计档案</strong>
            <small>无剧透 · 推理小说标签分析与推荐</small>
          </span>
        </a>

        <nav class="mainnav" id="mainnav" aria-label="主导航">
          <a href="#/analyze" data-nav="analyze">诡计分析</a>
          <a href="#/library" data-nav="library">知识库</a>
          <a href="#/countries" data-nav="countries">作者国别</a>
          <a href="#/authors" data-nav="authors">作者</a>
          <a href="#/tags" data-nav="tags">标签体系</a>
          <a href="#/compare" data-nav="compare">作品对比</a>
          <a href="#/manage" data-nav="manage">添加小说</a>
          <a href="#/about" data-nav="about">关于</a>
        </nav>

        <div class="topbar-actions">
          <span class="status-chip" id="store-status" title="数据源状态">
            <span class="dot" aria-hidden="true"></span>
            <span class="status-text">加载中…</span>
          </span>
          <button
            type="button"
            class="mode-switch"
            id="sensitive-toggle"
            role="switch"
            aria-checked="false"
            title="敏感模式：连诡计标签都不显示，只保留书名、简介、评价与阅读提示"
          >
            <span class="track" aria-hidden="true"><span class="knob"></span></span>
            <span class="label-off">普通模式</span>
            <span class="label-on">敏感模式</span>
          </button>
          <button type="button" class="icon-btn" id="theme-toggle" title="切换明暗主题" aria-label="切换明暗主题">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main id="main" class="main" tabindex="-1">
      <noscript>
        <div class="notice notice-error">
          <strong>需要启用 JavaScript</strong>
          <p>本系统全部计算在浏览器本地完成（不追踪、不上传），请启用 JavaScript 后重新加载页面。</p>
        </div>
      </noscript>
      <!-- 敏感模式横幅：仅在该模式开启时显示（CSS 控制），常驻而不是每次重绘 -->
      <div class="sensitive-banner" role="status">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </span>
        <div>
          <strong>敏感模式已开启</strong>
          <p>
            诡计标签、推理流派、匹配依据与同类分析已<strong>全部隐藏</strong>，
            页面只保留书名、作者、无剧透简介、平台评价与阅读提示。你可以放心浏览，不用担心被剧透。
          </p>
        </div>
      </div>
      <div class="loading-placeholder" id="initial-loading">
        <div class="spinner" aria-hidden="true"></div>
        <p>正在载入知识库…</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-rule">
          <strong>最高铁律</strong>：不写出凶手 · 不写出真相与结局 · 不解释诡计实现方式 · 只描述诡计类型
        </p>
        <p class="footer-meta">
          <span id="footer-stats">—</span>
          <span class="sep" aria-hidden="true">·</span>
          <a href="#/about">数据来源与免责声明</a>
          <span class="sep" aria-hidden="true">·</span>
          <span>全部计算在本地浏览器完成，不上传任何数据</span>
        </p>
        <!-- 备案信息（工信部要求：首页底部显著位置展示，并链接到工信部备案系统） -->
        <p class="footer-meta footer-beian">
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">陕ICP备2026028756号-1</a>
          <span class="sep" aria-hidden="true">·</span>
          <span>非经营性个人网站</span>
        </p>
      </div>
    </footer>

    <!-- 全局提示 -->
    <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
